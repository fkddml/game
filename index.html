
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레스토랑 미스터리</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #11131c;
  color: #eee;
  font-family: "Malgun Gothic", sans-serif;
}

button {
  cursor: pointer;
  font: inherit;
  touch-action: manipulation;
}

header {
  max-width: 1100px;
  margin: 12px auto;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

header strong {
  color: #e6d2ae;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

#count {
  color: #e9d4aa;
  font-weight: bold;
}

.ui-button {
  border: 1px solid #a69a85;
  border-radius: 7px;
  background: #303445;
  color: white;
  padding: 9px 12px;
}

#game {
  position: relative;
  width: min(100%, 1100px);
  aspect-ratio: 16 / 9;
  margin: auto;
  overflow: hidden;
  border: 3px solid #706b82;
  border-radius: 10px;
  background: #544e4c;
}

#map {
  display: block;
  width: 100%;
  height: 100%;
  background: #544e4c;
}

.map-label {
  fill: #eee0ca;
  font-size: 16px;
  font-weight: bold;
  text-anchor: middle;
  pointer-events: none;
}

.table-label {
  fill: #f6e5ca;
  font-size: 14px;
  text-anchor: middle;
  pointer-events: none;
}

.npc-label {
  fill: white;
  font-size: 14px;
  font-weight: bold;
  text-anchor: middle;
  paint-order: stroke;
  stroke: #20202a;
  stroke-width: 4px;
  pointer-events: none;
}

.clickable {
  cursor: pointer;
}

.clickable:hover {
  filter: brightness(1.25);
}

#notice {
  max-width: 1100px;
  margin: 12px auto;
  padding: 12px;
  background: #242838;
  border-left: 4px solid #c5a875;
  line-height: 1.6;
  font-size: 14px;
}

#dialogue {
  position: absolute;
  left: 4%;
  right: 4%;
  bottom: 3%;
  min-height: 28%;
  padding: 14px 18px;
  background: rgba(19, 21, 32, .97);
  border: 2px solid #c6a77c;
  border-radius: 7px;
  z-index: 20;
  display: none;
  cursor: pointer;
}

#speaker {
  color: #e8c48a;
  font-weight: bold;
  margin-bottom: 9px;
}

#dialogueText {
  font-size: 15px;
  line-height: 1.7;
  white-space: pre-wrap;
}

#dialogueHint {
  position: absolute;
  right: 14px;
  bottom: 8px;
  font-size: 11px;
  color: #b9b9c2;
}

#notebook {
  display: none;
  position: absolute;
  inset: 3%;
  z-index: 30;
  background: #eee0be;
  color: #322a24;
  border: 6px solid #6c513e;
  border-radius: 8px;
  padding: 16px;
  overflow-y: auto;
}

#notebook h2 {
  margin-top: 0;
}

#notebook button {
  border: 1px solid #8c7558;
  background: #d9c49f;
  color: #322a24;
  padding: 8px;
  border-radius: 5px;
}

#closeBook {
  float: right;
}

#tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 15px 0;
}

#tabs button.active {
  background: #795c41;
  color: white;
}

#bookContent {
  white-space: pre-wrap;
  line-height: 1.8;
  font-size: 14px;
}

#ending {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 50;
  background: #09090c;
  color: white;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
  font-size: clamp(18px, 4vw, 38px);
  line-height: 1.8;
  white-space: pre-line;
}

#controls {
  max-width: 1100px;
  margin: 12px auto;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 22px;
  flex-wrap: wrap;
  padding: 8px;
}

#dpad {
  display: grid;
  grid-template-columns: repeat(3, 52px);
  gap: 4px;
}

#dpad button {
  width: 52px;
  height: 48px;
  border: 1px solid #858a9d;
  background: #32384d;
  color: white;
  border-radius: 7px;
  font-size: 19px;
}

#interact {
  height: 48px;
  padding: 0 18px;
  background: #47445c;
  color: white;
  border: 1px solid #b6a486;
  border-radius: 7px;
}

#help {
  max-width: 1100px;
  margin: 8px auto 30px;
  padding: 0 12px;
  text-align: center;
  font-size: 12px;
  color: #aeb0bf;
}

@media (max-width: 600px) {
  header {
    margin: 4px auto;
    font-size: 12px;
  }

  .ui-button {
    padding: 7px;
    font-size: 12px;
  }

  #notice {
    font-size: 12px;
  }

  #dialogue {
    padding: 8px 10px;
    min-height: 40%;
  }

  #dialogueText {
    font-size: 11px;
  }

  #speaker {
    font-size: 12px;
    margin-bottom: 4px;
  }

  #notebook {
    padding: 9px;
  }

  #notebook h2 {
    font-size: 16px;
  }

  #bookContent {
    font-size: 11px;
  }
}
</style>
</head>

function svgElement(tag, attributes, parent) {
  const element = document.createElementNS(SVG_NS, tag);

  for (const [key, value] of Object.entries(attributes)) {
    element.setAttribute(key, value);
  }

  parent.appendChild(element);
  return element;
}

function makeText(x, y, value, className, parent) {
  const text = svgElement("text", {
    x,
    y,
    class: className
  }, parent);

  text.textContent = value;
  return text;
}

/* ========================================
   10. 이동과 충돌

   방 사이 이동은 문을 통해 가능
======================================== */

const TABLES = [
  { x: 260, y: 155, w: 110, h: 65 },
  { x: 610, y: 155, w: 110, h: 65 },
  { x: 440, y: 290, w: 110, h: 65 },
  { x: 260, y: 390, w: 110, h: 65 },
  { x: 610, y: 390, w: 110, h: 65 },
  { x: 195, y: 90, w: 80, h: 55 }
];

function insideRect(x, y, r, margin = 0) {
  return (
    x >= r.x - margin &&
    x <= r.x + r.w + margin &&
    y >= r.y - margin &&
    y <= r.y + r.h + margin
  );
}

function getRoom(x, y) {
  if (x >= 180 && x <= 800 && y >= 40 && y <= 520) {
    return "hall";
  }

  if (x >= 20 && x < 180 && y >= 340 && y <= 580) {
    return "lobby";
  }

  if (x > 800 && x <= 980 && y >= 40 && y < 230) {
    return "kitchen";
  }

  if (x > 800 && x <= 980 && y >= 230 && y < 360) {
    return "staff";
  }

  if (x > 800 && x <= 980 && y >= 360 && y <= 580) {
    return "storage";
  }

  if (x >= 380 && x <= 600 && y > 520 && y <= 580) {
    return "restroom";
  }

  return null;
}

function canMoveTo(nx, ny) {
  const oldRoom = getRoom(state.player.x, state.player.y);
  const newRoom = getRoom(nx, ny);

  if (!newRoom) return false;

  if (newRoom === "hall") {
    for (const table of TABLES) {
      if (insideRect(nx, ny, table, 12)) {
        return false;
      }
    }
  }

  if (oldRoom === newRoom) {
    return true;
  }

  // 홀 ↔ 로비
  if (
    (oldRoom === "hall" && newRoom === "lobby") ||
    (oldRoom === "lobby" && newRoom === "hall")
  ) {
    return ny >= 395 && ny <= 465;
  }

  // 홀 ↔ 주방
  if (
    (oldRoom === "hall" && newRoom === "kitchen") ||
    (oldRoom === "kitchen" && newRoom === "hall")
  ) {
    return ny >= 125 && ny <= 180;
  }

  // 홀 ↔ 직원실
  if (
    (oldRoom === "hall" && newRoom === "staff") ||
    (oldRoom === "staff" && newRoom === "hall")
  ) {
    return ny >= 275 && ny <= 325;
  }

  // 홀 ↔ 창고
  if (
    (oldRoom === "hall" && newRoom === "storage") ||
    (oldRoom === "storage" && newRoom === "hall")
  ) {
    return ny >= 425 && ny <= 480;
  }

  // 홀 ↔ 화장실
  if (
    (oldRoom === "hall" && newRoom === "restroom") ||
    (oldRoom === "restroom" && newRoom === "hall")
  ) {
    return nx >= 465 && nx <= 530;
  }

  return false;
}

function movePlayer(dx, dy) {
  if (
    dialogueOpen ||
    notebookOpen ||
    state.ended ||
    endingStarted
  ) {
    return;
  }

  const speed = 3;

  if (dx !== 0) {
    const nx = state.player.x + dx * speed;

    if (canMoveTo(nx, state.player.y)) {
      state.player.x = nx;
    }
  }

  if (dy !== 0) {
    const ny = state.player.y + dy * speed;

    if (canMoveTo(state.player.x, ny)) {
      state.player.y = ny;
    }
  }

  updatePlayerGraphic();
}

function distanceTo(x, y) {
  return Math.hypot(
    state.player.x - x,
    state.player.y - y
  );
}

   11. 대화 시스템
======================================== */

function startDialogue(lines, callback = null) {
  if (dialogueOpen || endingStarted) return;

  currentDialogue = lines;
  dialogueIndex = 0;
  dialogueCallback = callback;
  dialogueOpen = true;

  dialogueElement.style.display = "block";
  showDialogueLine();
}

function showDialogueLine() {
  const line = currentDialogue[dialogueIndex];

  if (!line) return;

  speakerElement.textContent = line[0];
  dialogueTextElement.textContent = line[1];
}

function nextDialogue() {
  if (!dialogueOpen) return;

  dialogueIndex++;

  if (dialogueIndex < currentDialogue.length) {
    showDialogueLine();
    return;
  }

  dialogueOpen = false;
  dialogueElement.style.display = "none";

  const callback = dialogueCallback;
  dialogueCallback = null;

  if (callback) callback();
}

function saveConversation(owner, lines) {
  if (!state.history[owner]) {
    state.history[owner] = [];
  }

  const text = lines
    .map(line => `${line[0]}: ${line[1]}`)
    .join("\n");

  state.history[owner].push(text);
}

/* ========================================
   12. NPC 대화 진행
======================================== */

function talkTo(id) {
  if (
    dialogueOpen ||
    notebookOpen ||
    state.ended ||
    endingStarted
  ) return;

  const npc = NPCS[id];

  if (distanceTo(npc.x, npc.y) > 115) {
    setNotice("인물에게 조금 더 가까이 다가가십시오.");
    return;
  }

  // 첫 대화
  if (!state.talked[id]) {
    const lines = FIRST_DIALOGUES[id];

    startDialogue(lines, () => {
      state.talked[id] = true;
      saveConversation(id, lines);

      drawNPCs();
      updatePhase();
      saveGame();
    });

    return;
  }

  // 증거를 발견한 뒤 열리는 대화
  const clue = EVIDENCE.find(e =>
    e.owner === id &&
    state.found.includes(e.id) &&
    !state.discussed.includes(e.id)
  );

  if (clue) {
    const lines = CLUE_DIALOGUES[clue.id];

    startDialogue(lines, () => {
      state.discussed.push(clue.id);
      saveConversation(id, lines);

      if (clue.id === "channel") {
        state.vtuberRevealed = true;
      }

      drawNPCs();
      updatePhase();
      saveGame();
    });

    return;
  }

  // 아직 새 증거가 없을 때
  startDialogue([
    [
      getNpcName(id),
      "지금은 더 말씀드릴 것이 없습니다."
    ]
  ]);
}

function drawEvidence() {
  itemLayer.replaceChildren();

  if (state.phase === "intro") {
    return;
  }

  if (state.phase === "bags") {
    drawBags();
    return;
  }

  for (const evidence of EVIDENCE) {
    if (state.found.includes(evidence.id)) {
      continue;
    }

    // 튜토리얼에서는 첫 증거 하나만 표시
    if (
      state.phase === "firstEvidence" &&
      evidence.id !== "messages"
    ) {
      continue;
    }

    // 첫 증거 관련 대화가 끝나기 전에는
    // 다른 증거를 해금하지 않음
    if (
      state.phase === "firstInterview" &&
      evidence.id !== "messages"
    ) {
      continue;
    }

    const group = svgElement("g", {
      class: "clickable"
    }, itemLayer);

    svgElement("rect", {
      x: evidence.x - 11,
      y: evidence.y - 10,
      width: 22,
      height: 20,
      rx: 3,
      fill: "#f0d48c",
      stroke: "#604b35",
      "stroke-width": 3
    }, group);

    makeText(
      evidence.x,
      evidence.y - 19,
      "◆",
      "npc-label",
      group
    );

    group.addEventListener("click", () => {
      collectEvidence(evidence.id);
    });

}

/* ========================================
   14. 증거 수집
======================================== */

function collectEvidence(id) {
  if (
    dialogueOpen ||
    notebookOpen ||
    state.ended ||
    endingStarted
  ) return;

  const evidence = EVIDENCE.find(e => e.id === id);

  if (!evidence) return;
  if (state.found.includes(id)) return;

  if (distanceTo(evidence.x, evidence.y) > 100) {
    setNotice("증거에 조금 더 가까이 다가가십시오.");
    return;
  }

  state.found.push(id);

  updateCounter();
  drawEvidence();
  drawNPCs();

  startDialogue([
    ["시스템", `새로운 증거를 발견했습니다.\n${evidence.name}`],
    ["탐정", evidence.description]
  ], () => {
    updatePhase();
    saveGame();
  });
}

/* ========================================
   15. 튜토리얼 진행

   첫 대화 전부 완료
   → 첫 증거 발견
   → 관련 NPC 추가 대화
   → 자유 탐색
======================================== */

function updatePhase() {
  if (state.ended) return;

  const allTalked = NPC_ORDER.every(id => state.talked[id]);

  if (!allTalked) {
    state.phase = "intro";

    const remaining = NPC_ORDER.filter(
      id => !state.talked[id]
    ).length;

    setNotice(
      `먼저 레스토랑의 NPC들과 대화하십시오. 남은 인물: ${remaining}명`
    );

    drawEvidence();
    return;
  }

  if (!state.found.includes("messages")) {
    state.phase = "firstEvidence";

    setNotice(
      "기본 조사를 완료했습니다. 이제 주변의 소지품을 확인하십시오."
    );

    drawEvidence();
    return;
  }

  if (!state.discussed.includes("messages")) {
    state.phase = "firstInterview";

    setNotice(
      "새로운 증거를 발견했습니다. 유튜버에게 다시 대화를 시도하십시오."
    );

    drawEvidence();
    return;
  }

  if (state.found.length < 10) {
    state.phase = "free";

    const pending = EVIDENCE.filter(e =>
      state.found.includes(e.id) &&
      !state.discussed.includes(e.id)
    ).length;

    setNotice(
      `이제 맵을 자유롭게 돌아다니며 증거를 수집하십시오. 추가 대화 가능: ${pending}건`
    );

    drawEvidence();
    return;
  }

  state.phase = "bags";

  setNotice(
    "아직 발견하지 못한 증거가 하나 남았습니다. 레스토랑에 있는 사람들의 가방을 조사하십시오."
  );

  drawEvidence();
}

function discoverFinalEvidence() {
  if (state.found.includes("medicine")) return;

  state.found.push("medicine");
  state.phase = "ending";

  updateCounter();
  saveGame();

  startDialogue([
    ["탐정", "내 가방도 확인해 봐야겠군."],
    ["탐정", "……"],
    ["탐정", "가방 안쪽에서 작은 약통이 나왔다."],
    ["탐정", "이건……"],
    ["탐정", "왜 내 가방에 있는 거지?"]
  ], () => {
    playEnding();
  });
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function playEnding() {
  endingStarted = true;
  endingElement.style.display = "flex";

  const memories = [
    "……",
    "레스토랑의 입구.",
    "피해자의 얼굴.",
    "누군가와 나누었던 대화.",
    "자신의 가방.",
    "기억나지 않는 순간들.",
    "……",
    "어?"
  ];

  for (const memory of memories) {
    endingElement.textContent = memory;

    await wait(memory === "어?" ? 2300 : 700);
  }

  endingElement.textContent = "";

  await wait(1200);

  endingElement.textContent = "END";

  state.ended = true;
  saveGame();
}

/* ========================================

   직업별 페이지
   증거와 대화 내용 자동 기록
======================================== */

function openNotebook() {
  if (dialogueOpen || endingStarted) return;

  notebookOpen = true;
  notebookElement.style.display = "block";

  renderNotebook();
}

function closeNotebook() {
  notebookOpen = false;
  notebookElement.style.display = "none";
}

function renderNotebook() {
  const tabs = document.getElementById("tabs");
  const content = document.getElementById("bookContent");

  tabs.replaceChildren();

  for (const id of NPC_ORDER) {
    const button = document.createElement("button");

    button.textContent = getNpcName(id);

    if (id === currentTab) {
      button.classList.add("active");
    }

    button.addEventListener("click", () => {
      currentTab = id;
      renderNotebook();
    });

    tabs.appendChild(button);
  }

  // 마지막 증거를 발견한 경우 탐정 페이지 추가
  if (state.found.includes("medicine")) {
    const button = document.createElement("button");
    button.textContent = "탐정";

    if (currentTab === "detective") {
      button.classList.add("active");
    }

    button.addEventListener("click", () => {
      currentTab = "detective";
      renderNotebook();
    });

    tabs.appendChild(button);
  }

  if (currentTab === "detective") {
    content.textContent =
      "【 탐정 】\n\n" +
      "■ 발견한 증거\n" +
      "약통\n" +
      "발견 장소: 자신의 가방\n\n" +
      "■ 대화 기록\n" +
      "……";

    return;
  }

  const name = getNpcName(currentTab);

  const found = EVIDENCE.filter(e =>
    e.owner === currentTab &&
    state.found.includes(e.id)
  );

  const history = state.history[currentTab] || [];

  let text = `【 ${name} 】\n\n`;

  text += "■ 기본 정보\n";

  if (state.talked[currentTab]) {
    text += `직업: ${name}\n`;
  } else {
    text += "아직 확인되지 않았습니다.\n";
  }

  text += "\n■ 발견한 증거\n";

  if (found.length === 0) {
    text += "아직 발견한 증거가 없습니다.\n";
  } else {
    for (const evidence of found) {
      text += `\n● ${evidence.name}\n`;
      text += `${evidence.description}\n`;

      if (state.discussed.includes(evidence.id)) {
        text += "관련 대화 완료\n";
      } else {
        text += "관련 대화 미완료\n";
      }
    }
  }

  text += "\n■ 대화 기록\n\n";

  if (history.length === 0) {
    text += "아직 기록된 대화가 없습니다.";
  } else {
    text += history.join("\n\n──────────\n\n");
  }

  content.textContent = text;
}

/* ========================================
   19. 주변 조사 버튼

   가까운 NPC 또는 증거와 상호작용
======================================== */

function interactNearest() {
  if (dialogueOpen) {
    nextDialogue();
    return;
  }

  if (notebookOpen || endingStarted || state.ended) {
    return;
  }

  const targets = [];

  for (const id of NPC_ORDER) {
    const npc = NPCS[id];

    targets.push({
      distance: distanceTo(npc.x, npc.y),
      action: () => talkTo(id)
    });
  }

  if (state.phase === "bags") {
    for (const bag of BAGS) {
      targets.push({
        distance: distanceTo(bag.x, bag.y),
        action: () => inspectBag(bag)
      });
    }
  } else if (state.phase !== "intro") {
    for (const evidence of EVIDENCE) {
      if (state.found.includes(evidence.id)) continue;

      if (
        (state.phase === "firstEvidence" ||
         state.phase === "firstInterview") &&
        evidence.id !== "messages"
      ) {
        continue;
      }

      targets.push({
        distance: distanceTo(evidence.x, evidence.y),
        action: () => collectEvidence(evidence.id)
      });
    }
  }

  targets.sort((a, b) => a.distance - b.distance);

  if (targets.length > 0 && targets[0].distance <= 110) {
    targets[0].action();
  } else {
    setNotice("조사할 대상이 주변에 없습니다.");
  }
}

/* ========================================
   20. 화면 정보 갱신
======================================== */

function setNotice(text) {
  noticeElement.textContent = "목표: " + text;
}

function updateCounter() {
  countElement.textContent =
    `증거 ${state.found.length}/${TOTAL_EVIDENCE}`;
}

/* ========================================
   21. 키보드 조작
======================================== */

document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();

  if (
    key.startsWith("arrow") ||
    key === " "
  ) {
    event.preventDefault();
  }

  if (key === "enter" || key === " ") {
    if (dialogueOpen) {
      nextDialogue();
    }
    return;
  }

  if (key === "e") {
    interactNearest();
    return;
  }

  if (key === "n") {
    if (notebookOpen) {
      closeNotebook();
    } else {
      openNotebook();
    }
    return;
  }

  if (key === "escape") {
    closeNotebook();
    return;
  }

  pressedKeys[key] = true;
});

document.addEventListener("keyup", event => {
  pressedKeys[event.key.toLowerCase()] = false;
});

window.addEventListener("blur", () => {
  pressedKeys = {};
});

/* ========================================
   22. 모바일 방향 버튼
======================================== */

const directionKeys = {
  up: "arrowup",
  down: "arrowdown",
  left: "arrowleft",
  right: "arrowright"
};

for (const button of document.querySelectorAll(
  "[data-direction]"
)) {
  const direction = button.dataset.direction;
  const key = directionKeys[direction];

  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    pressedKeys[key] = true;
    button.setPointerCapture(event.pointerId);
  });

  button.addEventListener("pointerup", () => {
    pressedKeys[key] = false;
  });

  button.addEventListener("pointercancel", () => {
    pressedKeys[key] = false;
  });

  button.addEventListener("lostpointercapture", () => {
    pressedKeys[key] = false;
  });
}

/* ========================================
   23. 게임 반복 실행
======================================== */

let lastFrame = 0;

function gameLoop(time) {
  if (time - lastFrame >= 16) {
    let dx = 0;
    let dy = 0;

    if (pressedKeys.arrowleft || pressedKeys.a) dx--;
    if (pressedKeys.arrowright || pressedKeys.d) dx++;
    if (pressedKeys.arrowup || pressedKeys.w) dy--;
    if (pressedKeys.arrowdown || pressedKeys.s) dy++;

    if (dx !== 0 || dy !== 0) {
      if (dx !== 0 && dy !== 0) {
        dx *= 0.707;
        dy *= 0.707;
      }

      movePlayer(dx, dy);
    }

    lastFrame = time;
  }

  requestAnimationFrame(gameLoop);
}

/* ========================================
   24. 저장 및 불러오기
======================================== */

function saveGame() {
  try {
    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(state)
    );
  } catch (error) {
    console.warn("저장 실패:", error);
  }
}

function loadGame() {
  try {
    const saved = localStorage.getItem(SAVE_KEY);

    if (!saved) return;

    const parsed = JSON.parse(saved);

    if (!parsed || !parsed.player) return;

    state = Object.assign(newGameState(), parsed);
  } catch (error) {
    console.warn("불러오기 실패:", error);
  }
}

function resetGame() {
  if (!confirm("게임 진행 상황을 초기화하시겠습니까?")) {
    return;
  }

  localStorage.removeItem(SAVE_KEY);
  location.reload();
}

/* ========================================
   25. 버튼 연결
======================================== */

document.getElementById("bookButton")
  .addEventListener("click", openNotebook);

document.getElementById("closeBook")
  .addEventListener("click", closeNotebook);

document.getElementById("resetButton")
  .addEventListener("click", resetGame);

document.getElementById("interact")
  .addEventListener("click", interactNearest);

dialogueElement.addEventListener("click", nextDialogue);

/* ========================================
   26. 게임 시작
======================================== */

function startGame() {
  loadGame();

  drawNPCs();
  drawPlayer();

  updateCounter();
  updatePhase();

  if (state.ended) {
    endingElement.style.display = "flex";
    endingElement.textContent = "END";
  } else if (state.phase === "ending") {
    // 엔딩 도중 새로고침한 경우
    state.ended = true;
    saveGame();

    endingElement.style.display = "flex";
    endingElement.textContent = "END";
  } else if (
    state.phase === "intro" &&
    Object.keys(state.talked).length === 0
  ) {
    startDialogue([
      ["시스템", "레스토랑에서 의문의 사망 사건이 발생했습니다."],
      ["시스템", "당신은 탐정입니다. 지금부터 사건을 수사하십시오."],
      ["시스템", "먼저 NPC들과 대화하여 기본 정보를 확인하십시오."]
    ]);
  }

  requestAnimationFrame(gameLoop);
}

startGame();

</script>
